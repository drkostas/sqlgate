[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlgate-client"
version = "0.1.0"
description = "A DB-API driver that sends MySQL statements to a sqlgate server over HTTPS, for SQLAlchemy apps on serverless hosts"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Konstantinos Georgiou" }]
keywords = ["mysql", "sqlalchemy", "dbapi", "serverless", "vercel", "self-hosted"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/drkostas/sqlgate"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["sqlgate_client"]
