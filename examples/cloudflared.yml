# A Cloudflare tunnel that publishes sqlgate and nothing else.
# The Neon driver posts to api.<rest of the host>, so a connection string for
# pg.db.example.com needs api.db.example.com to reach sqlgate.
tunnel: <your tunnel id>
credentials-file: /home/you/.cloudflared/<your tunnel id>.json

ingress:
  - hostname: api.db.example.com
    service: http://127.0.0.1:8102
  - service: http_status:404
