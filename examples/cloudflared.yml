# A Cloudflare tunnel that publishes sqlgate and nothing else.
# A connection string for db.example.com makes the Neon driver post to api.example.com,
# so both names point at sqlgate. Keep them one level below the domain, or a free
# Cloudflare certificate (which covers *.example.com only) will not cover them.
tunnel: <your tunnel id>
credentials-file: /home/you/.cloudflared/<your tunnel id>.json

ingress:
  - hostname: db.example.com
    service: http://127.0.0.1:8102
  - hostname: api.example.com
    service: http://127.0.0.1:8102
  - service: http_status:404
